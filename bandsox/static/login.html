<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BandSox — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/shared.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['JetBrains Mono', 'ui-monospace', 'monospace'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          }
        }
      }
    }
  </script>
</head>

<body class="flex items-center justify-center">
  <div class="w-full max-w-sm mx-auto px-6">
    <div style="background:var(--surface);border:1px solid var(--border-2);border-radius:6px;padding:32px;" class="space-y-8">
      <div class="text-center">
        <div style="font-size:20px;font-weight:700;color:var(--text);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:6px;">
          BAND<span style="color:var(--accent);">/</span>SOX
        </div>
        <p style="color:var(--text-faint);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;">Enter admin password</p>
      </div>

      <form id="login-form" class="space-y-4">
        <div>
          <input type="password" id="password" name="password" required autofocus
                 placeholder="Password" class="field-input">
        </div>
        <div id="error-msg" style="display:none;color:#f87171;font-size:12px;"></div>
        <button type="submit" id="submit-btn" class="btn-primary" style="width:100%;padding:10px 18px;">
          Log in
        </button>
      </form>
    </div>
  </div>

  <script>
    (async () => {
      try {
        const res = await fetch('/api/auth/check');
        if (res.ok) {
          const data = await res.json();
          if (data.authenticated) { window.location.href = '/'; return; }
        }
      } catch (e) {}
    })();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('error-msg');
      const btn = document.getElementById('submit-btn');
      const password = document.getElementById('password').value;

      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });

        if (res.ok) {
          const data = await res.json();
          if (data.token) localStorage.setItem('bandsox_session_token', data.token);
          window.location.href = '/';
        } else if (res.status === 429) {
          errEl.textContent = 'Too many attempts. Please wait and try again.';
          errEl.style.display = 'block';
        } else {
          errEl.textContent = 'Invalid password.';
          errEl.style.display = 'block';
        }
      } catch (err) {
        errEl.textContent = 'Connection error. Is the server running?';
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Log in';
      }
    });
  </script>
</body>

</html>
